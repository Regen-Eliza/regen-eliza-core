<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regen Eliza | Hackathon Demo</title>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: sans-serif; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; height: 100%; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b; }
        .header { padding: 20px; border-bottom: 1px solid #1e293b; text-align: center; font-weight: bold; color: #38bdf8; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; }
        .user { align-self: flex-end; background: #3b82f6; color: white; }
        .agent { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
        .input-area { padding: 20px; border-top: 1px solid #1e293b; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        button { padding: 12px 24px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">🌱 Regen Eliza Agent</div>
        <div class="messages" id="messages">
            <div class="message agent">Hello! I am Regen Eliza. I can help you with stablecoin swaps, remittances, and on-chain identity.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type a command..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value;
            if (!text) return;

            addMessage(text, "user");
            input.value = "";

            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text, userAddress: "0xMockUser" }) 
            });
            const data = await res.json();
            
            addMessage(data.reply, "agent");
        }

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            if (text.includes("http")) {
                div.innerHTML = text.replace(/(https:\/\/[^\s]+)/g, '<a href="" target="_blank" style="color:#38bdf8;text-decoration:underline;">Click to Pay</a>');
            } else {
                div.innerText = text;
            }
            document.getElementById("messages").appendChild(div);
            document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
        }
    </script>
</body>
</html>
